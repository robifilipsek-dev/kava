function norm(s){
  s.team=s.team?.length?s.team:[...DEFAULT_TEAM];
  for(const k of['counts','absent','paid','unav'])s[k]=s[k]||{};
  s.team.forEach(n=>{s.counts[n]=s.counts[n]||0;s.absent[n]=!!s.absent[n];s.paid[n]=!!s.paid[n];s.unav[n]=!!s.unav[n]});
  s.log=s.log||[];s.todayPayer=s.todayPayer||null;s.day=s.day||'';s.ver=s.ver||0;
  s.idx=Math.min(Math.max(s.idx||0,0),Math.max(s.team.length-1,0));
  return s;
}
let S=norm({});

// ===== LOGIKA VRSTE =====
const valid=(s,n)=>!s.absent[n]&&!s.unav[n];

function fair(s,unpaidOnly){
  const c=[];
  for(let i=0;i<s.team.length;i++){
    const n=s.team[i];
    if(!valid(s,n)||(unpaidOnly&&s.paid[n]))continue;
    c.push({ix:i, c:s.counts[n]||0});
  }
  if(!c.length)return -1;
  c.sort((a,b)=>a.c-b.c||a.ix-b.ix);
  return c[0].ix;
}

const nextIx=s=>{const i=fair(s,true);return i<0?fair(s,false):i};
const nextName=s=>{const i=nextIx(s);return i<0?null:s.team[i]};
function adv(s){const i=nextIx(s);if(i>=0)s.idx=i}

function checkRound(s){
  const av=s.team.filter(n=>valid(s,n));
  if(av.length&&av.every(n=>s.paid[n])){
    s.team.forEach(n=>s.paid[n]=false);
    s.team.forEach(n=>{if(s.absent[n])s.counts[n]++});
  }
}

function pay(s,who,type,by,inTurn=true){
  const d=new Date();
  s.counts[who]++;s.paid[who]=true;s.todayPayer=who;s.unav[who]=false;
  s.log.push({d:today(),t:`${p(d.getHours())}:${p(d.getMinutes())}`,who,type,by});
  if(s.log.length>2000)s.log.splice(0,s.log.length-2000);
  checkRound(s);if(inTurn)adv(s);
}

function clearTodayPayerState(s){
  if(!s.todayPayer) return;
  const payer = s.todayPayer;
  s.paid[payer] = false;
  s.todayPayer = null;
  // Števec zmanjšamo samo, če je bila runda res zabeležena (pay); ročna izbira skrbnika števca ni povečala.
  if(s.log.length > 0){
    const last = s.log[s.log.length - 1];
    if(last.who === payer && last.d === today()){
      s.log.pop();
      if(s.counts[payer] > 0) s.counts[payer]--;
    }
  }
  adv(s);
}

async function mutate(fn,noHist){
  const ref=doc(db,'kava','state');let before,after;
  await runTransaction(db,async tx=>{
    const sn=await tx.get(ref);const cur=norm(sn.exists()?sn.data():{});
    before=structuredClone(cur);fn(cur);norm(cur);cur.ver++;tx.set(ref,cur);after=cur;
  });
  if(!noHist){hist.push({before,ver:after.ver});if(hist.length>20)hist.shift()}
  S=after;render();
}
async function run(fn,ok,after){
  try{await mutate(fn);if(ok)toast(ok);after&&after()}
  catch(e){console.error(e);toast(e.message==='none'?'Ni dostopnih članov za kavo.':'Shranjevanje ni uspelo (preverite Firestore pravila).','err')}
}

function parseTime(v){
  v=String(v||'').trim().replace(/[.,;\s]+/g,':');
  let h,m;
  let x=v.match(/^(\d{1,2}):(\d{1,2})$/);
  if(x){h=+x[1];m=+x[2]}
  else if(x=v.match(/^(\d{1,2})$/)){h=+x[1];m=0}
  else if(x=v.match(/^(\d)(\d{2})$/)){h=+x[1];m=+x[2]}
  else if(x=v.match(/^(\d{2})(\d{2})$/)){h=+x[1];m=+x[2]}
  else return null;
  if(h>23||m>59)return null;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function inviteTimes(){
  const values=Array.isArray(CFG.inviteTimes)?CFG.inviteTimes:DEF.inviteTimes;

        if(nameEl)m.name=nameEl.value;if(trigEl)m.trigger=trigEl.value;if(textEl)m.text=textEl.value;
      });
    }else{CFG.teamsMsgs=[];}
    CFG.teamsMsgs.push({id:String(Date.now()),name:'Novo obvestilo',trigger:'invite',text:PRESET.invite});
    render();
  },
  delTeamMsg(i){
    const g=id=>document.getElementById(id);
    if(CFG.teamsMsgs){
      CFG.teamsMsgs.forEach((m,idx)=>{
        const nameEl=g(`t_name_${idx}`),trigEl=g(`t_trig_${idx}`),textEl=g(`t_text_${idx}`);
        if(nameEl)m.name=nameEl.value;if(trigEl)m.trigger=trigEl.value;if(textEl)m.text=textEl.value;
      });
      CFG.teamsMsgs.splice(i,1);noSync=true;
      render();
    }
  },
  addInviteTime(){
    const input=document.getElementById('newInviteTime');
    const time=parseTime(input.value);
    if(!time)return toast('Vpiši veljavno uro, npr. 12:15.','err');
    const times=[...document.querySelectorAll('#inviteTimePresets [data-time]')].map(e=>e.dataset.time);
    if(times.includes(time))return toast('Ta ura je že med predlogi.','info');
    times.push(time);times.sort();
    CFG.inviteTimes=times;
    document.getElementById('inviteTimePresets').innerHTML=timePresetButtons(times);
    input.value='';input.focus();
  },
  removeInviteTime(button){
    button.remove();
    CFG.inviteTimes=[...document.querySelectorAll('#inviteTimePresets [data-time]')].map(e=>e.dataset.time);
  },
  async saveCfg(){
    const g=id=>document.getElementById(id);
    const msgs=(CFG.teamsMsgs||[]).map((m,i)=>{
      const nameEl=g(`t_name_${i}`),trigEl=g(`t_trig_${i}`),textEl=g(`t_text_${i}`);
      return {
        id:m.id||String(i),
        name:nameEl?nameEl.value.trim():m.name,
        trigger:trigEl?trigEl.value:m.trigger,
        text:textEl?textEl.value.trim():m.text
      };
    });

    const c={
      active:g('s_active').checked,
      notice:g('s_notice').value.trim(),
      cols:g('s_cols').value,
      histDays:+g('s_histDays').value||0,
      inviteTime:CFG.inviteTime||'12:00',
      inviteTimes:inviteTimes(),
      teamsEnabled:g('t_enabled').checked,
      webhook:g('t_url').value.trim(),
      teamsMsgs:msgs
    };
    try{await setDoc(doc(db,'settings','main'),c);toast('Nastavitve shranjene.')}catch(e){console.error(e);toast('Shranjevanje ni uspelo (Firestore pravila).','err')}
  },
  async testTeams(){
    const el = document.getElementById('t_enabled');
    if(el && !el.checked){
      return toast('Teams obvestila so izklopljena v nastavitvah!','err');
    }
    const r=await teams('✅ Testno sporočilo iz aplikacije Odmor za kavo.');
    toast(r===null?'Webhook ni nastavljen ali pa so obvestila izklopljena.':r?'Testno sporočilo poslano.':'Pošiljanje ni uspelo.',r?'ok':'err');
  },
  
  ins(i,str){
    const ta=document.getElementById('t_text_'+i);if(!ta)return;
    const s0=ta.selectionStart??ta.value.length,e0=ta.selectionEnd??s0;
    ta.value=ta.value.slice(0,s0)+str+ta.value.slice(e0);
    const pos=s0+str.length;ta.focus();ta.setSelectionRange(pos,pos);A.prevTxt(i);
  },
  prevTxt(i){const ta=document.getElementById('t_text_'+i),pv=document.getElementById('t_prev_'+i);if(ta&&pv)pv.innerHTML=previewHtml(ta.value)},
  trigChange(i,sel){
    const ta=document.getElementById('t_text_'+i);if(!ta)return;
    const t=ta.value.trim();
    if(!t||t===(PRESET[sel.dataset.prev]||'')){ta.value=PRESET[sel.value]||'';A.prevTxt(i)}
    else toast('Tvoje besedilo je ohranjeno. Za predlog tapni »Predlagano besedilo«.','info');
    sel.dataset.prev=sel.value;
  },
  resetText(i){
    const sel=document.getElementById('t_trig_'+i),ta=document.getElementById('t_text_'+i);
    if(sel&&ta){ta.value=PRESET[sel.value]||'';A.prevTxt(i)}
  },
  setv(id,v){const e=document.getElementById(id);if(e){e.value=v;e.focus()}},
  addv(id,v){const e=document.getElementById(id);if(e){e.value=(e.value+v).slice(0,200);e.focus()}},

  // --- EKIPA ---
  count(i,d){run(s=>{const n=s.team[i];s.counts[n]=Math.max(0,s.counts[n]+d)})},
  setNext(i){run(s=>{s.idx=i},`${S.team[i]} je nastavljen kot naslednji.`)},
  togglePaid(i){run(s=>{const n=s.team[i];s.paid[n]=!s.paid[n]})},
  toggleAbs(i){run(s=>{const n=s.team[i];s.absent[n]=!s.absent[n];checkRound(s);adv(s)})},
  move(i,d){const j=i+d;if(j<0||j>=S.team.length)return;run(s=>{[s.team[i],s.team[j]]=[s.team[j],s.team[i]]})},
  rename(i){
    const nn=document.getElementById('rn'+i).value.trim(),old=S.team[i];
    if(!nn||nn===old||S.team.includes(nn))return;
    run(s=>{s.team[i]=nn;for(const k of['counts','absent','paid','unav']){s[k][nn]=s[k][old];delete s[k][old]}
      if(s.todayPayer===old)s.todayPayer=nn;s.log.forEach(l=>{if(l.who===old)l.who=nn})},'Ime spremenjeno.');
    if(me===old){me=nn;ls.set('kava_member_'+user.uid,me)}
  },
  async remove(i){
    if(S.team.length<2)return toast('V ekipi mora ostati vsaj en član.','err');
    const n=S.team[i];if(!await ask('Odstrani člana',`Odstranim člana ${n}?`,'Odstrani'))return;
    run(s=>{s.team=s.team.filter(x=>x!==n);for(const k of['counts','absent','paid','unav'])delete s[k][n];if(s.todayPayer===n)s.todayPayer=null},'Član odstranjen.');
  },
  add(){
    const el=document.getElementById('newName'),n=el.value.trim();
    if(!n||S.team.includes(n))return toast('Vnesite unikatno ime.','err');
    run(s=>{s.team.push(n)},'Član dodan.');el.value='';
  },
  async delUser(id){try{await deleteDoc(doc(db,'presence',id))}catch(e){toast('Brisanje ni uspelo.','err')}},
  async google(){
    const pr=new GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});
    try{
      const res = await signInWithPopup(auth,pr);
      if(res && res.user){
        me = ls.get('kava_member_' + res.user.uid) || me || '';
        if(!me || !S.team.includes(me)){
          A.pick();
        }
      }
    }catch(e){
      if(e.code==='auth/popup-blocked')return signInWithRedirect(auth,pr);
      if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')toast('Prijava ni uspela ('+(e.code||'napaka')+')','err');
    }
  },
  async guest(){
    try{
      const res = await signInAnonymously(auth);
      if(res && res.user){
        me = ls.get('kava_member_' + res.user.uid) || me || '';
        if(!me || !S.team.includes(me)){
          A.pick();
        }
      }
    }catch(e){toast('Gostujoča prijava ni uspela. Preverite, ali je v Firebase omogočen "Anonymous".','err')}
  },
  async logout(){
    try{if(user)await setDoc(doc(db,'presence',user.uid),{lastSeen:0},{merge:true})}catch(e){}
    await signOut(auth);
  },
  async install(){
    if(installEv){installEv.prompt();await installEv.userChoice;installEv=null;render()}
    else toast(isIOS?"Tapni 'Deli' v Safariju in izberi 'Dodaj na začetni zaslon'.":"V meniju brskalnika izberi 'Namesti aplikacijo'.",'info');
  },
  help(){
    document.getElementById('help').innerHTML=helpView();
    document.body.style.overflow='hidden';
  },
  closeHelp(){
    document.getElementById('help').innerHTML='';
    document.body.style.overflow='';
  },
  contact(){location.href='mailto:'+['robi.filipsek','gmail.com'].join('@')+'?subject='+encodeURIComponent('Odmor za kavo')}
};

      cls = 'border-slate-200 bg-slate-100 opacity-60 dark:bg-slate-800/50 dark:border-slate-800';
      st = 'Dopust / odsoten';

      cls = 'border-red-200 bg-red-50 dark:bg-red-950/20 dark:border-red-900/40';
      st = 'Danes ne more';

      st = 'Časti danes';

      cls = 'border-blue-200 bg-blue-50/50 dark:bg-slate-800/80 dark:border-slate-700';
      st = 'Že dal';
    }

    const badgeCls = isPayer ? 'text-emerald-800 bg-emerald-100 border-emerald-300 dark:bg-emerald-900/60 dark:text-emerald-300 dark:border-emerald-700' : 'text-blue-800 bg-blue-100 border-blue-300 dark:bg-blue-950 dark:text-blue-300 dark:border-blue-800';
    return `<div data-team-state="${S.absent[name]?'away':S.unav[name]?'unavailable':isPayer?'payer':isNext?'next':S.paid[name]?'paid':'waiting'}" class="rounded-xl border p-3 transition-all flex flex-col gap-2.5 ${cls}">
      <div class="flex items-center justify-between gap-2">
        <span class="flex items-center gap-1.5 min-w-0"><strong class="text-sm truncate ${isPayer ? 'text-emerald-600 dark:text-emerald-400 font-extrabold' : ''}">${esc(name)}</strong>${name===me?'<span class="text-[10px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded-md bg-slate-200 text-slate-700 dark:bg-slate-700 dark:text-slate-200 shrink-0">jaz</span>':''}</span>

  }).join('');

    <div class="grid sm:grid-cols-2 gap-2 mt-4">
      <button onclick="A.confirm()" class="b bg-emerald-600 hover:bg-emerald-500"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg> Potrjujem rundo</button>
      <button onclick="A.cant()" class="b bg-red-600 hover:bg-red-500"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/></svg> Danes ne more</button>
      <button onclick="A.sponsor()" class="b bg-amber-500 hover:bg-amber-400"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.3.9-4.5 4.4 1 6.2-5.6-3-5.6 3 1-6.2L3 9.6l6.2-.9z"/></svg> Častim mimo vrste</button>
      <button onclick="A.invite()" class="b bg-indigo-600 hover:bg-indigo-500"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 18-7-6 18-4-7-8-4Zm8 4L21 3"/></svg> Povabi na kavo (Teams)</button>
      <button onclick="A.undo()" class="b bg-slate-600 hover:bg-slate-500 dark:bg-slate-700 sm:col-span-2"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5-6 6 6 5m-5-5h11a5 5 0 0 1 0 10"/></svg> Razveljavi</button></div></div>
  <h2 class="team-title">Ekipa</h2><div class="mg" style="--c:${cols}">${cards}</div>
  <div class="text-xs text-slate-500 dark:text-slate-400 mt-4 flex items-center justify-between">
    <span>Izbrana oseba s seznama: <strong class="text-slate-800 dark:text-slate-200">${esc(me&&S.team.includes(me)?me:'Niste izbrali osebe')}</strong></span>
    <span>${loaded?'✓ Sinhronizirano':'Nalaganje …'}</span></div>`;
}

let histFilter='';
function viewHistory(){
  const hd=+CFG.histDays||0;
  const cutoff=hd?iso(new Date(Date.now()-hd*864e5)):'';
  const all0=[...S.log].map((l,i)=>({...l,i})).filter(l=>l&&typeof l.d==='string'&&l.d.includes('-'));
  const all1=(hd&&!isAdmin())?all0.filter(l=>l.d>=cutoff):all0;
  const all=all1.sort((a,b)=>(b.d+(b.t||'')).localeCompare(a.d+(a.t||'')));
  const names=[...new Set([...S.team,...all.map(l=>l.who)])];
  if(histFilter&&!names.includes(histFilter))histFilter='';
  const list=histFilter?all.filter(l=>l.who===histFilter):all;
  const tally={};all.forEach(l=>{tally[l.who]=(tally[l.who]||0)+1});
  const chips=`<span class="chip chip-t" style="display:inline-flex;align-items:center">Skupaj: ${all.length}</span>`+
    Object.entries(tally).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`<span class="chip chip-t" style="display:inline-flex;align-items:center">${esc(n)}: ${c}</span>`).join('');
  const typeLbl={turn:'',invite:'⏰ povabilo',sponsor:'⭐ prostovoljno',manual:'✍️ ročno'};
  let html='',lastM='';
  list.forEach(l=>{
    const [y,m,d]=l.d.split('-').map(Number);
    const dt=new Date(y,m-1,d);
    const ml=dt.toLocaleDateString('sl-SI',{month:'long',year:'numeric'});
    if(ml!==lastM){html+=`<div class="text-xs font-bold uppercase tracking-widest mt-5 mb-2" style="color:var(--coffee)">${esc(ml)}</div>`;lastM=ml}
    const dl=dt.toLocaleDateString('sl-SI',{weekday:'long',day:'numeric',month:'numeric',year:'numeric'});
    const tl=typeLbl[l.type]||'';
    html+=`<div class="ios-group flex items-center justify-between gap-2 px-3 py-2.5 mb-1.5">
      <div class="min-w-0"><div class="text-xs capitalize" style="color:var(--muted)">${esc(dl)}${l.t?' · '+esc(l.t):''}</div>
      <div class="font-bold text-base truncate">${esc(l.who)}${tl?`<span class="text-[10px] font-bold ml-2 px-2 py-0.5 rounded-full" style="background:var(--honey-bg);color:var(--honey)">${tl}</span>`:''}</div></div>
      ${isAdmin()?`<div class="flex gap-1 shrink-0"><button onclick="A.editLog(${l.i})" class="text-xs px-2.5 py-1.5 rounded-lg bg-blue-600 text-white" title="Uredi zapis">✏️</button><button onclick="A.delLog(${l.i})" class="text-xs px-2.5 py-1.5 rounded-lg bg-red-600 text-white" title="Izbriši zapis">🗑️</button></div>`:''}
    </div>`;
  });
  if(!list.length)html=`<div class="text-center text-sm py-8" style="color:var(--muted)">${all.length?'Ni zapisov za izbrano osebo.':'Zgodovina je še prazna. Od zdaj naprej se beleži, kdo je kateri dan častil.'}</div>`;
  const manual=isAdmin()?`<details class="ios-group mb-3 px-3 py-2.5"><summary class="cursor-pointer select-none font-semibold text-sm">✍️ Ročni vnos (skrbnik)</summary>
    <div class="mt-3 space-y-2">
      <input id="mDate" type="date" class="inp" max="${today()}" value="${today()}">
      <select id="mWho" class="inp">${S.team.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select>
      <label class="flex items-center gap-2 text-xs" style="color:var(--muted)"><input id="mCount" type="checkbox"> Prištej tudi k števcu rund</label>
      <button onclick="A.addLog()" class="b bg-blue-600 hover:bg-blue-500 w-full">➕ Dodaj zapis</button>
      <button onclick="A.cleanLog()" class="b bg-slate-600 hover:bg-slate-500 w-full">🧹 Izbriši stare zapise …</button>
    </div></details>`:'';
  const note=isAdmin()
    ?`<p class="text-xs mb-3" style="color:var(--muted)">Kot skrbnik vidiš vse zapise (${all0.length}).${hd?` Uporabniki vidijo zadnjih ${hd} dni.`:' Uporabniki vidijo vse.'}</p>`
    :(hd?`<p class="text-xs mb-3" style="color:var(--muted)">Prikazani so zapisi zadnjih ${hd} dni.</p>`:'');
  return `<div class="${card}">
    ${manual}
    ${note}
    <div class="flex flex-wrap gap-1.5 mb-3">${chips}</div>
    <select class="inp mb-2" onchange="A.histF(this.value)"><option value="">Vsi sodelavci</option>${names.map(n=>`<option value="${esc(n)}" ${n===histFilter?'selected':''}>${esc(n)}</option>`).join('')}</select>
    ${html}</div>`;
}

    <div class="flex items-center justify-between gap-3 px-4 sm:px-5 py-3.5 border-b border-slate-200 dark:border-slate-800">
      <h3 class="font-bold text-lg">Navodila za uporabo</h3>
      <button onclick="A.closeHelp()" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 font-bold hover:bg-slate-200 dark:hover:bg-slate-700" title="Zapri" aria-label="Zapri">✕</button>
    </div>
    <div class="overflow-y-auto px-4 sm:px-5 py-4 space-y-3">

      ${sec('☕','Kaj aplikacija počne',`
        <p>Aplikacija pošteno razporeja, kdo je na vrsti, da <strong>časti kavo</strong>. Vsi v ekipi vidijo isto stanje v živo, zato vam ni treba ničesar usklajevati ročno.</p>
        <p>Med prisotnimi, ki v tem krogu še niso plačali, je na vrsti oseba z ${b('najmanj plačanimi rundami')} (številka ☕ ob imenu). Če jih ima več enako, odloča vrstni red na seznamu. Ko so na vrsto prišli vsi, ki so danes prisotni, se krog začne znova.</p>`,true)}

      ${sec('→','Prvi koraki',`
        <ol class="list-decimal pl-5 space-y-1">

          <li>Na vprašanje »Kdo si na seznamu?« izberite ${b('svoje ime')} in kliknite ${b('Potrdi ime')}. Izbira se zapomni na tej napravi.</li>

        <p>Pri svojem imenu na seznamu vidite oznako ${b('JAZ')}.</p>`)}

      ${sec('🔘','Kdaj pritisniti kateri gumb',`
        <div>

        ${btn('bg-red-600','Danes ne more',`Pritisnite, ko ${b('oseba na vrsti danes ne more')} plačati (npr. je ni, nima časa). Označena je kot »Danes ne more« in na vrsti je naslednji. Naslednji dan se ta oznaka sama ponastavi.`)}
        ${btn('bg-amber-500','Častim mimo vrste',`Pritisnite, ko ${b('vi sami')} prostovoljno častite kavo, čeprav niste na vrsti. Plačana runda se vam všteje, vrstni red pa ostane pošten. Če ste bili slučajno prav vi na vrsti, se vrsta pomakne naprej.`)}
        ${btn('bg-indigo-600','Povabi na kavo (Teams)',`Pritisnite, ko je čas za kavo. Polje je predizpolnjeno s trenutnim časom ob kliku. Uro lahko spremenite, izberete s hitrim gumbom ali v isto polje namesto ure vpišete besedilo. Izberite »Pošlji vabilo«. Če je pošiljanje nastavljeno, se vabilo objavi v kanalu Teams. ${b('Pozor:')} če danes še nihče ni potrjen, se s tem gumbom hkrati potrdi tudi runda za osebo, ki je na vrsti.`)}
        ${btn('bg-slate-600','Razveljavi',`Vrne zadnje dejanje, ki ste ga naredili vi (do 20 korakov). Ne deluje, če je medtem kdo drug spremenil stanje. Že poslanih Teams sporočil ne more preklicati.`)}
        </div>
        <p>Ko se odpre potrditveno okno, preverite izbrano dejanje. Z gumbom ${b('Prekliči')} ali tipko <kbd>Esc</kbd> ga zaprete brez sprememb.</p>`)}

      ${sec('🧑‍🤝‍🧑','Kartice ekipe in statusi',`
        <p>Vsaka kartica prikazuje ime, število plačanih rund (☕) in status:</p>
        <ul class="space-y-1">
          <li>${b('Na vrsti za kavo')}: jantarni rob, naslednji plačnik.</li>
          <li>${b('Časti danes')}: zelen rob, danes potrjeni plačnik.</li>
          <li>${b('Že dal')}: v tem krogu je že plačal.</li>
          <li>${b('Čaka na vrsto')}: še ni bil na vrsti.</li>
          <li>${b('Danes ne more')}: danes je preskočen.</li>
          <li>${b('Dopust / odsoten')}: skrbnik ga je označil kot odsotnega.</li>
        </ul>
        <p>Gumb ${b('✓ Prisoten / × Odsoten')} na kartici lahko kliknete za vsakogar: če nekdo danes ni v službi, ga označite kot odsotnega in bo preskočen. Oznaka se naslednji dan sama ponastavi.</p>`)}

      ${sec('🔔','Obvestila v Teams: kako jih nastaviti, da ne zamudite sporočila',`
        <p>Aplikacija objavi sporočilo v skupni Teams kanal. Da vas Teams opozori nanj (pasica na zaslonu, zvok, značka), si nastavite obvestila za ta kanal. Nastavitev je osebna, zato jo mora narediti vsak zase:</p>
        <p class="font-semibold text-slate-800 dark:text-slate-100">💻 Računalnik (Teams za namizje ali brskalnik)</p>
        <ol class="list-decimal pl-5 space-y-1">
          <li>V Teams odprite zavihek ${b('Ekipe')} in poiščite kanal, kamor aplikacija pošilja sporočila.</li>

          <li>Kliknite ${b('Shrani')}.</li>

          <li>Pri nastavitvi za vse nove objave izberite možnost, ki prikaže pasico (če jo aplikacija ponuja, ${b('Pokaži v Dejavnosti in pasici')}).</li>

        <ul class="list-disc pl-5 space-y-1">

function viewAdmin(){
  const ck=(id,v,t)=>`<label class="flex items-center justify-between gap-3 text-sm cursor-pointer"><span>${t}</span><input type="checkbox" id="${id}" ${v?'checked':''} class="ios-sw"></label>`;
  
  // Teams obvestila kartice
  const msgs=(CFG.teamsMsgs||[]).map((m,i)=>`<div class="ios-group p-3 space-y-2.5 text-xs">
    <div class="flex items-center justify-between gap-2"><span class="font-bold text-sm">Obvestilo ${i+1}</span>
      <button onclick="A.delTeamMsg(${i})" class="text-red-500 font-semibold text-sm">Izbriši</button></div>
    <label class="${lbl}">Ime obvestila<input id="t_name_${i}" value="${esc(m.name)}" class="inp mt-1"></label>
    <label class="${lbl}">Pošlji, ko pritisneš gumb<select id="t_trig_${i}" data-prev="${esc(m.trigger)}" onchange="A.trigChange(${i},this)" class="inp mt-1">${TRIG.map(t=>`<option value="${t[0]}" ${m.trigger===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select></label>
    <div class="${lbl}">Dotakni se za vstavitev ikone ali podatka
      <div class="chips mt-1.5">${EMO.map(e=>`<button type="button" class="chip" onclick="A.ins(${i},'${e} ')">${e}</button>`).join('')}</div>
      <div class="chips mt-2">${TOK.map(t=>`<button type="button" class="chip chip-t" onclick="A.ins(${i},'${t[1]}')">${t[0]}</button>`).join('')}</div></div>
    <label class="${lbl}">Besedilo<textarea id="t_text_${i}" rows="3" oninput="A.prevTxt(${i})" class="inp mt-1">${esc(m.text)}</textarea></label>
    <div class="flex items-center justify-between gap-2"><span class="${lbl}">Predogled</span><button onclick="A.resetText(${i})" class="text-blue-500 font-semibold">Predlagano besedilo</button></div>
    <div id="t_prev_${i}" class="bubble">${previewHtml(m.text)}</div>
  </div>`).join('');

  const team=S.team.map((n,i)=>`<div class="p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60 space-y-2 text-xs">
    <div class="flex gap-1"><input id="rn${i}" value="${esc(n)}" class="inp"><button onclick="A.rename(${i})" class="px-2 rounded-lg bg-blue-600 text-white">✏️</button><button onclick="A.remove(${i})" class="px-2 rounded-lg bg-red-600 text-white">🗑️</button></div>
    <div class="flex items-center justify-between"><span class="font-semibold">Skupaj rund:</span><span class="flex items-center gap-1"><button onclick="A.count(${i},-1)" class="px-2 py-1 rounded bg-slate-200 dark:bg-slate-700">➖</button><strong class="w-6 text-center">${S.counts[n]}</strong><button onclick="A.count(${i},1)" class="px-2 py-1 rounded bg-slate-200 dark:bg-slate-700">➕</button></span></div>
    <div class="flex flex-wrap gap-1"><button onclick="A.setNext(${i})" class="px-2 py-1 rounded bg-blue-600 text-white">👉 Naslednji</button>
    <button onclick="A.togglePaid(${i})" class="px-2 py-1 rounded text-white ${S.paid[n]?'bg-emerald-600':'bg-slate-500'}">${S.paid[n]?'✅':'⭕'} Že dal</button>
    <button onclick="A.toggleAbs(${i})" class="px-2 py-1 rounded text-white ${S.absent[n]?'bg-red-600':'bg-slate-500'}">${S.absent[n]?'🌴':'⭕'} Dopust</button>
    <button onclick="A.move(${i},-1)" class="px-2 py-1 rounded bg-slate-200 dark:bg-slate-700">⬆️</button><button onclick="A.move(${i},1)" class="px-2 py-1 rounded bg-slate-200 dark:bg-slate-700">⬇️</button></div></div>`).join('');
  
  const now=Date.now();
  const users=[...presence].sort((a,b)=>(b.lastSeen?.toMillis?.()||0)-(a.lastSeen?.toMillis?.()||0)).map(u=>{
    const ms=u.lastSeen?.toMillis?.()||0,on=now-ms<=180000;
    return `<div class="flex items-center justify-between gap-2 px-3 py-2 text-xs"><span class="min-w-0"><span class="inline-block w-2 h-2 rounded-full mr-1 ${on?'bg-emerald-500':'bg-slate-300 dark:bg-slate-700'}"></span><strong class="dark:text-slate-200">${esc(u.member||u.name||'Brez imena')}</strong> <span class="text-slate-500 dark:text-slate-400">${u.isAnonymous?'Gost':esc(u.email)}</span><div class="text-slate-400">Zadnjič: ${ms?new Date(ms).toLocaleString('sl-SI'):'-'}</div></span>
    <button onclick="A.delUser('${esc(u.id)}')" class="px-2 py-1 rounded bg-red-100 text-red-700 border border-red-300 dark:bg-red-950 dark:text-red-300 dark:border-red-800">Izbriši</button></div>`;
  }).join('');
  const online=presence.filter(u=>now-(u.lastSeen?.toMillis?.()||0)<=180000).length;

  const payerOptions = `<option value="none" ${!S.todayPayer ? 'selected' : ''}>-- Izklopljeno (Prikaz: Na vrsti za kavo) --</option>` +
    S.team.map(n => `<option value="${esc(n)}" ${S.todayPayer === n ? 'selected' : ''}>${esc(n)}</option>`).join('');

  return `<div class="space-y-4">
  <div class="${card} space-y-4"><h2 class="font-bold text-lg">⚙️ Splošne nastavitve</h2>
    ${ck('s_active',CFG.active,'Aplikacija je aktivna')}
    <div class="grid sm:grid-cols-2 gap-3">
      <label class="${lbl}">Obvestilo na vrhu strani<input id="s_notice" maxlength="160" value="${esc(CFG.notice)}" class="inp mt-1" placeholder="Npr. Danes kava ob 12:15"></label>
      <div class="${lbl}">Predlogi ur za povabilo
        <div id="inviteTimePresets" class="chips mt-2">${timePresetButtons(inviteTimes())}</div>
        <div class="flex gap-2 mt-2"><input id="newInviteTime" type="text" inputmode="numeric" autocomplete="off" aria-label="Nova ura za predlog" placeholder="Npr. 12:20" class="inp" onkeydown="if(event.key==='Enter'){event.preventDefault();A.addInviteTime()}"><button type="button" onclick="A.addInviteTime()" class="b bg-blue-600">Dodaj</button></div>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-2">Klikni predlog, da ga odstraniš. Spremembe potrdi z gumbom Shrani nastavitve. Polje v povabilu je vedno predizpolnjeno s trenutnim časom.</p>
      </div>
    </div>
    <div class="grid sm:grid-cols-2 gap-3">
      <label class="${lbl}">Zgodovina: koliko nazaj vidijo uporabniki<select id="s_histDays" class="inp mt-1">${[[0,'Vse'],[30,'Zadnjih 30 dni'],[90,'Zadnjih 90 dni'],[180,'Zadnjih 180 dni'],[365,'Zadnje leto']].map(([v,t])=>`<option value="${v}" ${(+CFG.histDays||0)===v?'selected':''}>${t}</option>`).join('')}</select></label>
    </div>
    <div class="grid sm:grid-cols-2 gap-3">
      <label class="${lbl}">Število stolpcev ekipe<select id="s_cols" class="inp mt-1">${['auto','2','3'].map(v=>`<option value="${v}" ${CFG.cols===v?'selected':''}>${v==='auto'?'Samodejno':v}</option>`).join('')}</select></label>
      <label class="${lbl}">Nastavitev statusa "Časti danes"<select onchange="A.setPayerAdmin(this.value)" class="inp mt-1 font-semibold text-blue-600 dark:text-blue-400">${payerOptions}</select></label>
    </div>
    ${S.todayPayer ? `
      <div class="pt-1">
        <button onclick="A.clearTodayPayer()" class="b bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold">❌ Izklopi "Časti danes" (${esc(S.todayPayer)})</button>
      </div>
    ` : ''}
  </div>

  <div class="${card} space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="font-bold text-lg">🔔 Teams obvestila</h2>
      <button onclick="A.addTeamMsg()" class="b bg-blue-600 hover:bg-blue-500 text-xs">➕ Dodaj obvestilo</button>
    </div>
    <div class="bg-slate-50 dark:bg-slate-800/80 p-3 rounded-xl border border-slate-200 dark:border-slate-700 mb-2">
      ${ck('t_enabled',CFG.teamsEnabled,'Vklopi pošiljanje obvestil na Teams')}
    </div>
    <label class="${lbl}">Power Automate Webhook URL<input id="t_url" value="${esc(CFG.webhook)}" class="inp mt-1" placeholder="https://..."></label>
    <p class="text-xs text-slate-500 dark:text-slate-400">Ob izbiri gumba se besedilo samo predizpolni. Ime, uro in datum aplikacija vstavi sama.</p>
    <div class="space-y-3">${msgs||'<div class="text-xs text-slate-500 p-2">Ni nastavljenih Teams obvestil. Kliknite "Dodaj obvestilo".</div>'}</div>
    <div class="flex gap-2 pt-2"><button onclick="A.saveCfg()" class="b bg-kg hover:bg-slate-800">💾 Shrani nastavitve</button><button onclick="A.testTeams()" class="b bg-indigo-600 hover:bg-indigo-500">Pošlji test na Teams</button></div>
  </div>

  <div class="${card} space-y-3"><h2 class="font-bold text-lg">👥 Ekipa</h2><div class="grid sm:grid-cols-2 gap-2">${team}</div>
    <div class="flex gap-2"><input id="newName" placeholder="Ime novega sodelavca" class="inp"><button onclick="A.add()" class="b bg-blue-600 hover:bg-blue-500 whitespace-nowrap">➕ Dodaj</button></div></div>

  <div class="${card} space-y-3"><h2 class="font-bold text-lg flex items-center gap-2">👥 Uporabniki <span class="text-xs bg-blue-100 text-blue-700 dark:bg-blue-950 dark:text-blue-300 border border-blue-200 dark:border-blue-800 px-2.5 py-0.5 rounded-full font-semibold">${online} aktivnih</span></h2>
    <div class="max-h-80 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800 border border-slate-200 dark:border-slate-800 rounded-xl">${users||'<div class="p-4 text-xs text-slate-500">Ni zapisov.</div>'}</div></div></div>`;
}

function render(){
  const app=document.getElementById('app');
  if(!user){app.innerHTML=loginView();return}
  if(tab==='admin'&&!noSync)syncMsgs();noSync=false;
  if((tab==='admin'||tab==='history')&&document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&app.contains(document.activeElement))return;
  const body = tab==='admin' && isAdmin() ? viewAdmin() : tab==='history' ? viewHistory() : viewMain();
  app.innerHTML=`${header()}${hero()}<main class="max-w-4xl mx-auto px-4 py-5">
    ${CFG.notice?`<div class="mb-4 p-3 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm">ℹ️ ${esc(CFG.notice)}</div>`:''}
    ${body}</main>`;
}

// ===== PRIJAVA =====
onAuthStateChanged(auth,u=>{
  user=u;
  if(u){
    me=ls.get('kava_member_'+u.uid)||'';
    startListeners();beat();
    if(!me || !S.team.includes(me)) {
      A.pick();
    }
  }else{stop();me='';tab='main'}
  render();
});
render();
</script>
</body>
</html>
