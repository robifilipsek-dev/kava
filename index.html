    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #f8fafc;
            --text: #94a3b8;
            --text-bright: #f1f5f9;
            --accent: #10b981;
            --accent-hover: #059669;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px;
            max-width: 580px;
            width: 100%;
            box-shadow: var(--shadow);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 15px;
        }

        h1 {
            color: var(--text-bright);
            font-size: 20px;
            margin: 0;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .header-info {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .badge {
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 20px;
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: var(--text-bright);
            font-weight: 600;
        }

        .status-box {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(59, 130, 246, 0.05) 100%);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .status-box span {
            font-size: 11px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
            display: block;
        }

        .status-box strong {
            font-size: 26px;
            color: var(--text-bright);
            display: block;
            margin: 8px 0 10px 0;
            font-weight: 900;
        }

        .next-person-info {
            font-size: 12px;
            color: var(--text);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn {
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            padding: 12px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-confirm { background: var(--accent); color: #0f172a; }
        .btn-confirm:hover { background: #34d399; }

        .btn-cant { background: var(--danger); color: white; }
        .btn-cant:hover { background: #f87171; }

        .btn-sponsor { background: var(--info); color: white; grid-column: span 2; }
        .btn-sponsor:hover { background: #60a5fa; }

        .btn-invite { background: #8b5cf6; color: white; grid-column: span 2; }
        .btn-invite:hover { background: #a78bfa; }

        .btn-undo { background: #334155; color: var(--text-bright); grid-column: span 2; }
        .btn-undo:hover { background: #475569; }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(var(--member-cols, 2), 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .member-card {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 60px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .member-card.is-next { background: rgba(16, 185, 129, 0.05); border-color: var(--accent); }
        .member-card.is-paid { background: rgba(59, 130, 246, 0.05); border-color: var(--info); }
        .member-card.is-unavailable { background: rgba(239, 68, 68, 0.05); border-color: var(--danger); opacity: 0.7; }
        .member-card.is-absent { background: rgba(15, 23, 42, 0.6); border-style: dashed; opacity: 0.4; filter: grayscale(80%); }

        .member-name {
            font-weight: 700;
            font-size: 13px;
            color: var(--text-bright);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .member-meta {
            font-size: 11px;
            color: var(--text);
            margin-top: 4px;
        }

        .absent-toggle-btn {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text);
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .absent-toggle-btn:hover {
            background: var(--card-border);
            color: var(--text-bright);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--card-border);
            padding-top: 15px;
            font-size: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-info span { font-weight: 700; color: var(--text-bright); }
        .link-btn { color: var(--info); cursor: pointer; text-decoration: underline; margin-left: 5px; }

        .icon-btn {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-bright);
            transition: background 0.2s;
        }
        .icon-btn:hover { background: var(--card-border); }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 20px;
            max-width: 820px;
            width: 95%;
            box-shadow: var(--shadow);
            max-height: 90vh;
            overflow-y: auto;
            color: var(--text-bright);
            box-sizing: border-box;
        }

        .modal h2 { margin-top: 0; color: var(--text-bright); font-size: 18px; }
        
        select, input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: #0f172a;
            color: var(--text-bright);
            font-size: 13px;
            margin: 6px 0 12px 0;
            box-sizing: border-box;
            font-weight: 600;
        }

        label { font-size: 12px; font-weight: 700; color: var(--text); }

        .admin-members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 8px;
            margin-bottom: 15px;
        }

        .admin-member-row {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .admin-member-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .admin-member-name-input { 
            flex: 1; 
            margin: 0 !important; 
            padding: 4px 8px; 
            font-size: 12px; 
            height: 30px;
        }

        .admin-controls-inline { 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            flex-wrap: wrap; 
        }

        .mini-btn {
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .admin-section {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .round-badge {
            font-size: 10px;
            font-weight: 800;
            color: var(--accent);
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            padding: 2px 7px;
            white-space: nowrap;
        }

        .install-btn {
            display: none;
        }
        .install-btn.visible {
            display: flex;
        }

        /* Ozek zaslon (telefon): manj robov, mreža vedno 2 stolpca za simetrijo */
        @media (max-width: 480px) {
            body { padding: 12px 6px; }
            .container { padding: 16px; border-radius: 18px; }
            h1 { font-size: 17px; }
            .action-buttons { gap: 8px; }
            .btn { padding: 11px; font-size: 12px; }
            .members-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 8px;
            }
            .member-card { padding: 10px 12px; min-height: 54px; }
            .member-name { font-size: 12.5px; }
            .footer { font-size: 11px; }
        }

        @media (max-width: 360px) {
            .members-grid {
                grid-template-columns: 1fr !important;
            }
        }
    </style>

    let historyStack = [];
    let gridColumnsSetting = "auto"; // "auto" | "2" | "3"

    function sendTeamsNotification(message) {
        if (!teamsWebhookUrl || teamsWebhookUrl.trim() === "") return;
        const payload = {
            "type": "message",
            "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "contentUrl": null,
                "content": {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    "type": "AdaptiveCard",
                    "version": "1.2",
                    "body": [{ "type": "TextBlock", "text": message, "wrap": true }]
                }
            }]
        };
        fetch(teamsWebhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).catch(err => console.error("Napaka Teams:", err));
    }

    function saveStateSnapshot() {
        historyStack.push({
            team: [...team],
            counts: { ...counts },
            absent: { ...absent },
            currentRoundPaid: { ...currentRoundPaid },
            dailyUnavailable: { ...dailyUnavailable },
            todayPayer: todayPayer,
            currentIndex: currentIndex,
            lastRotationDate: lastRotationDate
        });
        if (historyStack.length > 20) historyStack.shift();
    }

    function undoLastAction() {
        if (historyStack.length === 0) {
            alert("Ni prejšnjih dejanj za povrnitev.");
            return;
        }
        const previousState = historyStack.pop();
        team = previousState.team;
        counts = previousState.counts;
        absent = previousState.absent;
        currentRoundPaid = previousState.currentRoundPaid;
        dailyUnavailable = previousState.dailyUnavailable;
        todayPayer = previousState.todayPayer || null;
        currentIndex = previousState.currentIndex;
        lastRotationDate = previousState.lastRotationDate;

        clampIndex();
        renderUI();
        pushToCloud();
        alert("Stanje je bilo uspešno povrnjeno!");
    }

    function init() {
        loadLocalStorage();
        setupLoginDropdown(); 
        
        if (!loggedInUser) {
            document.getElementById('loginOverlay').style.display = 'flex';
        } else {
            document.getElementById('loggedInUserDisplay').innerText = loggedInUser;
            document.getElementById('loginOverlay').style.display = 'none';
        }
        
        syncWithCloud(() => {
            setupLoginDropdown(); 
            checkDateRollover();
            renderUI();
        }, true);

        setInterval(() => { syncWithCloud(null, false); }, 60000);
    }

    function clampIndex() {
        if (team.length === 0) {
            currentIndex = 0;
            return;
        }
        if (currentIndex < 0 || currentIndex >= team.length) {
            currentIndex = Math.max(0, Math.min(currentIndex, team.length - 1));
        }
    }

    function loadLocalStorage() {
        try {
            const saved = localStorage.getItem('COFFEE_APP_STATE_NO_TEAMS');
            if (saved) {
                const data = JSON.parse(saved);
                if (data.team?.length > 0) team = data.team;
                if (data.counts) counts = data.counts;
                if (data.absent) absent = data.absent;
                if (data.currentRoundPaid) currentRoundPaid = data.currentRoundPaid;
                if (data.dailyUnavailable) dailyUnavailable = data.dailyUnavailable;
                if (data.todayPayer !== undefined) todayPayer = data.todayPayer;
                if (typeof data.currentIndex === 'number') currentIndex = data.currentIndex;
                if (data.lastRotationDate) lastRotationDate = data.lastRotationDate;
                if (data.timestamp) appTimestamp = data.timestamp;
                if (data.teamsWebhookUrl !== undefined) teamsWebhookUrl = data.teamsWebhookUrl;
                if (data.teamsMsgConfirm !== undefined) teamsMsgConfirm = data.teamsMsgConfirm;
                if (data.teamsMsgCant !== undefined) teamsMsgCant = data.teamsMsgCant;
                if (data.teamsMsgSponsor !== undefined) teamsMsgSponsor = data.teamsMsgSponsor;
                if (data.teamsMsgInvite !== undefined) teamsMsgInvite = data.teamsMsgInvite;
                if (data.loggedInUser) loggedInUser = data.loggedInUser;
                if (data.gridColumnsSetting !== undefined) gridColumnsSetting = data.gridColumnsSetting;
            }
        } catch(e) {}

        clampIndex();
        team.forEach(name => {
            if (!(name in counts)) counts[name] = 0;
            if (!(name in absent)) absent[name] = false;
            if (!(name in currentRoundPaid)) currentRoundPaid[name] = false;
            if (!(name in dailyUnavailable)) dailyUnavailable[name] = false;
        });
    }

    function saveLocalStorage() {
        clampIndex();
        const state = { team, counts, absent, currentRoundPaid, dailyUnavailable, todayPayer, currentIndex, lastRotationDate, timestamp: appTimestamp, teamsWebhookUrl, teamsMsgConfirm, teamsMsgCant, teamsMsgSponsor, teamsMsgInvite, loggedInUser, gridColumnsSetting };
        localStorage.setItem('COFFEE_APP_STATE_NO_TEAMS', JSON.stringify(state));
    }

    function setupLoginDropdown() {
        const select = document.getElementById('loginSelect');
        if (!select) return;
        select.innerHTML = '';
        (team.length > 0 ? team : DEFAULT_TEAM).forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.innerText = name;
            select.appendChild(opt);
        });
        if (loggedInUser && team.includes(loggedInUser)) {
            select.value = loggedInUser;
        }
    }

    function handleLogin() {
        const select = document.getElementById('loginSelect');
        if (!select) return;
        loggedInUser = select.value;
        if (!loggedInUser) return;
        
        document.getElementById('loggedInUserDisplay').innerText = loggedInUser;
        document.getElementById('loginOverlay').style.display = 'none';

        renderUI();
        pushToCloud();
    }

    function openLoginModal() {
        setupLoginDropdown();
        document.getElementById('loginOverlay').style.display = 'flex';
    }

    function checkDateRollover() {
        const now = new Date();
        const todayStr = now.toDateString();
        let needsCloudPush = false;

        const dateBadge = document.getElementById('dateBadge');
        if (dateBadge) {
            dateBadge.innerText = now.toLocaleDateString('sl-SI', { weekday: 'short', day: 'numeric', month: 'numeric' });
        }

        if (lastRotationDate && lastRotationDate !== todayStr) {
            team.forEach(name => { dailyUnavailable[name] = false; });
            todayPayer = null;
            needsCloudPush = true;
        }
        
        lastRotationDate = todayStr;
        saveLocalStorage();
        if (needsCloudPush) pushToCloud();
    }

    function isPersonValid(name) {
        return !absent[name] && !dailyUnavailable[name];
    }

    // Poišče indeks "najbolj pravičnega" upravičenega člana za naslednjo rundo:
    // prednost ima tisti z manj rundami (counts), pri izenačenju pa vrstni red rotacije
    // (najbližji naprej od currentIndex). Če requireUnpaid=true, upošteva samo tiste,
    // ki v tem krogu (currentRoundPaid) še niso plačali.
    function findFairestEligibleIndex(requireUnpaid) {
        if (team.length === 0) return -1;
        let candidates = [];
        for (let i = 0; i < team.length; i++) {
            let idx = (currentIndex + i) % team.length;
            let name = team[idx];
            if (!isPersonValid(name)) continue;
            if (requireUnpaid && currentRoundPaid[name]) continue;
            candidates.push({ idx, order: i, count: counts[name] || 0 });
        }
        if (candidates.length === 0) return -1;
        candidates.sort((a, b) => (a.count !== b.count) ? a.count - b.count : a.order - b.order);
        return candidates[0].idx;
    }

    function getNextEligiblePerson() {
        if (team.length === 0) return "-";
        clampIndex();

        let idx = findFairestEligibleIndex(true);
        if (idx !== -1) return team[idx];

        idx = findFairestEligibleIndex(false);
        if (idx !== -1) return team[idx];

        return "-";
    }

    function advanceToNextEligiblePerson() {
        if (team.length === 0) return;
        clampIndex();

        let idx = findFairestEligibleIndex(true);
        if (idx !== -1) { currentIndex = idx; return; }

        idx = findFairestEligibleIndex(false);
        if (idx !== -1) { currentIndex = idx; return; }
    }

    function checkRoundCompletion() {
        // Krog velja za zaključen, ko so vsi trenutno RAZPOLOŽLJIVI člani (torej
        // niso ne dolgotrajno odsotni ne danes nedostopni) plačali svojo rundo.
        // Če ravno zadnji "dolžnik" postane nedostopen/odsoten, se krog kljub temu
        // pravilno zaključi in začne nov krog - namesto da bi vrsta pomotoma skočila
        // na nekoga, ki je to rundo že plačal.
        const availableMembers = team.filter(isPersonValid);
        if (availableMembers.length > 0 && availableMembers.every(m => currentRoundPaid[m])) {
            team.forEach(m => { currentRoundPaid[m] = false; });

            // Kdor je trenutno na daljšem dopustu/bolniški (absent), je ravnokar "zamudil"
            // cel krog rund ostalih. Da po vrnitvi ne bo v zaostanku (in posledično
            // nesorazmerno pogosto na vrsti zaradi manjšega št. rund), se mu za vsak
            // tak zamujen krog samodejno prišteje ena runda.
            team.forEach(m => {
                if (absent[m]) {
                    counts[m] = (counts[m] || 0) + 1;
                }
            });

            return true;
        }
        return false;
    }

    function supabaseHeaders(extra) {
        return Object.assign({
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        }, extra || {});
    }

    function fetchCloudRecord() {
        // select=data,timestamp vrne samo naš JSON blob iz vrstice z id = SUPABASE_ROW_ID
        return fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.${SUPABASE_ROW_ID}&select=data`, {
            method: 'GET',
            headers: supabaseHeaders({ 'Cache-Control': 'no-cache' })
        })
        .then(res => res.json())
        .then(rows => (rows && rows[0] && rows[0].data) ? rows[0].data : null);
    }

    function syncWithCloud(onComplete, forceServer = false) {
        const syncStatus = document.getElementById('syncStatus');
        if (syncStatus && forceServer) syncStatus.innerText = '⏳ Nalagam...';

        fetchCloudRecord()
        .then(cloudData => {
            if (cloudData) {
                if (forceServer || !cloudData.timestamp || cloudData.timestamp > appTimestamp) {
                    if (cloudData.team?.length > 0) team = cloudData.team;
                    if (cloudData.counts) counts = cloudData.counts;
                    if (cloudData.absent) absent = cloudData.absent;
                    if (cloudData.currentRoundPaid) currentRoundPaid = cloudData.currentRoundPaid;
                    if (cloudData.dailyUnavailable) dailyUnavailable = cloudData.dailyUnavailable;
                    if (cloudData.todayPayer !== undefined) todayPayer = cloudData.todayPayer;
                    if (typeof cloudData.currentIndex === 'number') currentIndex = cloudData.currentIndex;
                    if (cloudData.lastRotationDate) lastRotationDate = cloudData.lastRotationDate;
                    if (cloudData.teamsWebhookUrl !== undefined) teamsWebhookUrl = cloudData.teamsWebhookUrl;
                    if (cloudData.teamsMsgConfirm !== undefined) teamsMsgConfirm = cloudData.teamsMsgConfirm;
                    if (cloudData.teamsMsgCant !== undefined) teamsMsgCant = cloudData.teamsMsgCant;
                    if (cloudData.teamsMsgSponsor !== undefined) teamsMsgSponsor = cloudData.teamsMsgSponsor;
                    if (cloudData.teamsMsgInvite !== undefined) teamsMsgInvite = cloudData.teamsMsgInvite;
                    if (cloudData.gridColumnsSetting !== undefined) gridColumnsSetting = cloudData.gridColumnsSetting;

                    appTimestamp = cloudData.timestamp || Date.now();
                    clampIndex();
                    saveLocalStorage();
                }
            }
            if (syncStatus) syncStatus.innerText = '✅ Sinhronizirano';
            setupLoginDropdown();
            checkDateRollover();
            renderUI();
            if (onComplete) onComplete(true);
        })
        .catch(() => {
            if (syncStatus) syncStatus.innerText = '⚠️ Lokalno';
            setupLoginDropdown();
            renderUI();
            if (onComplete) onComplete(false);
        });
    }

    function performCloudAction(actionFn, onComplete, mergeCounts = true) {
        fetchCloudRecord()
        .then(cloudData => {
            // mergeCounts=true: uporabi se za vsakdanja dejanja (potrditev runde, častitka ...),
            // kjer želimo obdržati morebitna sočasna povečanja z drugih naprav.
            // mergeCounts=false: uporabi se, kadar admin ROČNO nastavi točno vrednost (tudi navzdol) -
            // v tem primeru je lokalna vrednost avtoritativna in se ne sme "popraviti" nazaj navzgor.
            if (mergeCounts && cloudData?.counts) {
                for (let key in cloudData.counts) {
                    counts[key] = Math.max(counts[key] || 0, cloudData.counts[key] || 0);
                }
            }
            actionFn();
            pushToCloud(onComplete);
        })
        .catch(() => {
            actionFn();
            pushToCloud(onComplete);
        });
    }

    function pushToCloud(onComplete) {
        if (syncTimer) clearTimeout(syncTimer);
        syncTimer = setTimeout(() => {
            appTimestamp = Date.now();
            clampIndex();
            saveLocalStorage();

            const payload = { team, counts, absent, currentRoundPaid, dailyUnavailable, todayPayer, currentIndex, lastRotationDate, timestamp: appTimestamp, teamsWebhookUrl, teamsMsgConfirm, teamsMsgCant, teamsMsgSponsor, teamsMsgInvite, gridColumnsSetting };

            // upsert: če vrstica z id=1 obstaja, jo posodobi, sicer jo ustvari (resolution=merge-duplicates)
            fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`, {
                method: 'POST',
                headers: supabaseHeaders({
                    'Content-Type': 'application/json',
                    'Prefer': 'resolution=merge-duplicates,return=minimal'
                }),
                body: JSON.stringify({ id: SUPABASE_ROW_ID, data: payload })
            })
            .then(res => {
                const syncStatus = document.getElementById('syncStatus');
                if (res.ok) {
                    if (syncStatus) syncStatus.innerText = '✅ Sinhronizirano';
                    if (onComplete) onComplete(true);
                } else {
                    if (syncStatus) syncStatus.innerText = '⚠️ Napaka';
                    if (onComplete) onComplete(false);
                }
            })
            .catch(() => {
                const syncStatus = document.getElementById('syncStatus');
                if (syncStatus) syncStatus.innerText = '⚠️ Brez povezave';
                if (onComplete) onComplete(false);
            });
        }, 200);
    }

    function confirmMyCoffee() {
        const active = todayPayer || getNextEligiblePerson();
        if (active === "-") {
            alert("Trenutno ni dostopnih članov za kavo.");
            return;
        }

        if (confirm(`Ali potrjuješ, da bo ${active} danes ob 12:00 dal za kavo?`)) {
            performCloudAction(() => {
                saveStateSnapshot();
                counts[active] = (counts[active] || 0) + 1;
                currentRoundPaid[active] = true;
                todayPayer = active;
                dailyUnavailable[active] = false; 

                checkRoundCompletion();
                advanceToNextEligiblePerson();

                renderUI();
            }, (success) => {
                if (success) {
                    alert("Runda uspešno potrjena in sinhronizirana!");
                    sendTeamsNotification(teamsMsgConfirm.replace(/{ime}/g, active));
                }
            });
        }
    }

    function cantGiveCoffee() {
        const active = getNextEligiblePerson();
        if (active === "-") {
            alert("Trenutno ni dostopnih članov za kavo.");
            return;
        }

        if (confirm(`Označi, da ${active} danes ne more dati za kavo?`)) {
            performCloudAction(() => {
                saveStateSnapshot();
                dailyUnavailable[active] = true; 
                currentRoundPaid[active] = false;
                
                checkRoundCompletion();
                advanceToNextEligiblePerson(); 
                renderUI();
            }, (success) => {
                const newActive = getNextEligiblePerson();
                if (success) {
                    alert("Zabeleženo, naslednji je na vrsti.");
                    sendTeamsNotification(teamsMsgCant.replace(/{ime}/g, active).replace(/{naslednji}/g, newActive));
                }
            });
        }
    }

    function sponsorCoffee() {
        if (!loggedInUser) {
            alert("Najprej se prijavi!");
            return;
        }
        if (confirm(`Ali potrjuješ, da ${loggedInUser} danes prostovoljno časti kavo?`)) {
            performCloudAction(() => {
                saveStateSnapshot();
                // Kdo bi moral biti danes na vrsti PRED to častitko
                const rightfulNext = getNextEligiblePerson();
                const isInTurn = (loggedInUser === rightfulNext);

                counts[loggedInUser] = (counts[loggedInUser] || 0) + 1;
                currentRoundPaid[loggedInUser] = true;
                todayPayer = loggedInUser;
                dailyUnavailable[loggedInUser] = false;
                
                checkRoundCompletion();

                // Vrsto pomaknemo naprej samo, če je častil tisti, ki je bil dejansko na vrsti.
                // Če je nekdo počastil izven vrstnega reda, ostane oseba, ki bi morala
                // danes dati za kavo, še vedno naslednja na vrsti.
                if (isInTurn) {
                    advanceToNextEligiblePerson();
                }

                renderUI();
            }, (success) => {
                if (success) {
                    alert("Hvala za častitko in sinhronizacijo!");
                    sendTeamsNotification(teamsMsgSponsor.replace(/{ime}/g, loggedInUser));
                }
            });
        }
    }

    function inviteToCoffee() {
        let time = prompt("Ob kateri uri gremo danes na kavo?", "12:00");
        if (time) {
            let userToNotify = loggedInUser || "Neznano";
            let msg = teamsMsgInvite.replace(/{ime}/g, userToNotify).replace(/{cas}/g, time);
            sendTeamsNotification(msg);
            alert(`Vabilo za ob ${time} je bilo uspešno poslano na Teams!`);
        }
    }

    function toggleAbsence(name) {
        performCloudAction(() => {
            saveStateSnapshot();
            dailyUnavailable[name] = !dailyUnavailable[name];

            checkRoundCompletion();
            advanceToNextEligiblePerson();
            renderUI();
        });
    }

    function getEffectiveColumnCount() {
        if (gridColumnsSetting === "2" || gridColumnsSetting === "3") {
            return parseInt(gridColumnsSetting, 10);
        }
        // "auto": sodo število oseb -> 2 stolpca, liho -> 3 stolpci (praviloma se lepše izide)
        return (team.length % 2 === 0) ? 2 : 3;
    }

    function renderUI() {

        const nextPerson = getNextEligiblePerson();
        
        const subtitleEl = document.getElementById('statusSubtitle');
        const nameEl = document.getElementById('currentPersonName');

        if (todayPayer) {
            subtitleEl.innerText = "⭐ Danes potrjeno časti:";
            nameEl.innerText = todayPayer;
            nameEl.style.color = "var(--accent)";
        } else {
            subtitleEl.innerText = "Na vrsti da časti:";
            nameEl.innerText = nextPerson;
            nameEl.style.color = "var(--text-bright)";
        }

        document.getElementById('settingsBtn').style.display = (loggedInUser === "Filipšek") ? 'flex' : 'none';

        const grid = document.getElementById('membersGrid');
        grid.innerHTML = '';
        grid.style.setProperty('--member-cols', getEffectiveColumnCount());

                cardClass += " is-paid";
                statusText = "⭐ Časti danes";
            } else if (isNext) {
                cardClass += " is-next";
                statusText = "👉 Na vrsti";
            } else if (isTodayPaid) {
                cardClass += " is-paid";
                statusText = "✅ Že dal";

    function openAdminModal() {
        if (loggedInUser !== "Filipšek") return;
        const pin = prompt("🔒 Vnesi admin PIN:");
        if (pin === null) return;
        if (pin !== ADMIN_PIN) {
            alert("Napačen PIN.");
            return;
        }
        document.getElementById('adminModal').style.display = 'flex';
        document.getElementById('teamsWebhookInput').value = teamsWebhookUrl || '';
        document.getElementById('teamsMsgConfirmInput').value = teamsMsgConfirm || '';
        document.getElementById('teamsMsgCantInput').value = teamsMsgCant || '';
        document.getElementById('teamsMsgSponsorInput').value = teamsMsgSponsor || '';
        document.getElementById('teamsMsgInviteInput').value = teamsMsgInvite || '';
        document.getElementById('gridColumnsSelect').value = gridColumnsSetting || 'auto';
        renderAdminMembers();
    }

    function closeAdminModal() {
        document.getElementById('adminModal').style.display = 'none';
        renderUI();
    }

    function renderAdminMembers() {
        const list = document.getElementById('adminMembersList');
        if (!list) return;
        list.innerHTML = '';

        team.forEach((name, index) => {
            const isAbs = absent[name];
            const isPaid = currentRoundPaid[name];
            const userCount = counts[name] || 0;

            const row = document.createElement('div');
            row.className = 'admin-member-row';
            row.innerHTML = `
                <div class="admin-member-top">
                    <input type="text" class="admin-member-name-input" id="nameInput_${index}" value="${name}">
                    <button class="mini-btn" style="background:#3b82f6; color:white;" onclick="renameMember(${index})">✏️</button>
                    <button class="mini-btn" style="background:var(--danger); color:white;" onclick="removeMember('${name}')">🗑️</button>
                </div>
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 4px;">
                    <span style="font-size: 11px; font-weight: bold; color: var(--text);">Skupaj rund:</span>
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <button class="mini-btn" style="background:#334155; color:white;" onclick="changeCount('${name}', -1)">➖</button>
                        <span style="font-size: 12px; font-weight: bold; min-width: 20px; text-align: center; color: var(--text-bright);">${userCount}</span>
                        <button class="mini-btn" style="background:#334155; color:white;" onclick="changeCount('${name}', 1)">➕</button>
                    </div>
                </div>
                <div class="admin-controls-inline" style="justify-content: space-between; border-top: 1px solid var(--card-border); padding-top: 4px;">
                    <button class="mini-btn" style="background:#3b82f6; color:white;" onclick="setAsNext(${index})" title="Nastavi kot naslednjega">👉 Naslednji</button>
                    <button class="mini-btn" style="background: ${isPaid ? '#10b981' : '#334155'}; color:white;" onclick="togglePaid('${name}')">${isPaid ? '✅ Že dal' : '⭕ Že dal'}</button>
                    <button class="mini-btn" style="background: ${isAbs ? '#ef4444' : '#334155'}; color:white;" onclick="toggleAbsent('${name}')">${isAbs ? '🌴 Dopust' : '⭕ Dopust'}</button>
                    <button class="mini-btn" style="background:#334155; color:white;" onclick="moveMember(${index}, -1)">⬆️</button>
                    <button class="mini-btn" style="background:#334155; color:white;" onclick="moveMember(${index}, 1)">⬇️</button>
                </div>
            `;
            list.appendChild(row);
        });
    }

    function changeCount(name, amount) {
        saveStateSnapshot();
        counts[name] = Math.max(0, (counts[name] || 0) + amount);
        renderAdminMembers();
    }

    function setAsNext(index) {
        saveStateSnapshot();
        currentIndex = index;
        clampIndex();
        renderAdminMembers();
        alert(`Član ${team[index]} je nastavljen kot naslednji!`);
    }

    function renameMember(index) {
        const input = document.getElementById(`nameInput_${index}`);
        if (!input) return;
        const newName = input.value.trim();
        const oldName = team[index];
        if (!newName || newName === oldName || team.includes(newName)) return;

        saveStateSnapshot();
        team[index] = newName;
        counts[newName] = counts[oldName] || 0; delete counts[oldName];
        absent[newName] = absent[oldName] || false; delete absent[oldName];
        currentRoundPaid[newName] = currentRoundPaid[oldName] || false; delete currentRoundPaid[oldName];
        dailyUnavailable[newName] = dailyUnavailable[oldName] || false; delete dailyUnavailable[oldName];
        if (todayPayer === oldName) todayPayer = newName;

        setupLoginDropdown();
        renderAdminMembers();
    }

    function toggleAbsent(name) {
        saveStateSnapshot();
        absent[name] = !absent[name];
        renderAdminMembers();
    }

    function togglePaid(name) {
        saveStateSnapshot();
        currentRoundPaid[name] = !currentRoundPaid[name];
        renderAdminMembers();
    }

    function moveMember(index, direction) {
        const newIdx = index + direction;
        if (newIdx < 0 || newIdx >= team.length) return;
        saveStateSnapshot();
        const temp = team[index];
        team[index] = team[newIdx];
        team[newIdx] = temp;
        clampIndex();
        renderAdminMembers();
    }

    function addMember() {
        const input = document.getElementById('newMemberNameInput');
        const name = input.value.trim();
        if (!name || team.includes(name)) return;
        saveStateSnapshot();
        team.push(name);
        counts[name] = 0; absent[name] = false; currentRoundPaid[name] = false; dailyUnavailable[name] = false;
        input.value = '';
        clampIndex();
        setupLoginDropdown();
        renderAdminMembers();
    }

    function removeMember(name) {
        if (confirm(`Odstrani člana ${name}?`)) {
            saveStateSnapshot();
            team = team.filter(m => m !== name);
            delete counts[name]; delete absent[name]; delete currentRoundPaid[name]; delete dailyUnavailable[name];
            if (todayPayer === name) todayPayer = null;
            clampIndex();
            setupLoginDropdown();
            renderAdminMembers();
        }
    }

    function saveAllAdminChanges() {
        performCloudAction(() => {
            saveStateSnapshot();
            teamsWebhookUrl = document.getElementById('teamsWebhookInput').value.trim();
            teamsMsgConfirm = document.getElementById('teamsMsgConfirmInput').value.trim();
            teamsMsgCant = document.getElementById('teamsMsgCantInput').value.trim();
            teamsMsgSponsor = document.getElementById('teamsMsgSponsorInput').value.trim();
            teamsMsgInvite = document.getElementById('teamsMsgInviteInput').value.trim();
            gridColumnsSetting = document.getElementById('gridColumnsSelect').value;

            checkRoundCompletion();
            advanceToNextEligiblePerson();

            saveLocalStorage();
        }, (success) => {
            alert(success ? "Spremembe uspešno shranjene in sinhronizirane!" : "Spremembe shranjene lokalno.");
            closeAdminModal();
            renderUI();
        }, false); // mergeCounts=false: ročno spremenjeno št. rund (tudi navzdol) se ne sme prepisati nazaj navzgor
    }

    // --- NAMESTITEV NA ZAČETNI ZASLON (PWA) ---
    let deferredInstallPrompt = null;

    function isRunningStandalone() {
        return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        const btn = document.getElementById('installBtn');
        if (btn && !isRunningStandalone()) btn.classList.add('visible');
    });

    window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        const btn = document.getElementById('installBtn');
        if (btn) btn.classList.remove('visible');
    });

    function isIOS() {
        return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
    }

    async function handleInstallClick() {
        if (deferredInstallPrompt) {
            deferredInstallPrompt.prompt();
            const { outcome } = await deferredInstallPrompt.userChoice;
            deferredInstallPrompt = null;
            const btn = document.getElementById('installBtn');
            if (btn) btn.classList.remove('visible');
            return;
        }
        if (isIOS()) {
            alert("📲 Namestitev na iPhone/iPad:\n\n1. Tapni na ikono 'Deli' (kvadrat s puščico) v Safariju\n2. Izberi 'Dodaj na začetni zaslon'\n3. Potrdi z 'Dodaj'");
        } else {
            alert("📲 Za namestitev odpri meni brskalnika (⋮) in izberi 'Namesti aplikacijo' oz. 'Dodaj na začetni zaslon'.");
        }
    }

    function setupInstallButton() {
        const btn = document.getElementById('installBtn');
        if (!btn) return;
        if (isRunningStandalone()) {
            btn.classList.remove('visible');
        } else if (isIOS()) {
            // iOS ne podpira beforeinstallprompt, gumb prikažemo takoj z navodili
            btn.classList.add('visible');
        }
    }

    window.onload = function() {
        init();
        setupInstallButton();
    };
</script>
